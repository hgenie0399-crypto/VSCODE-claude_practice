<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>우리 반 독서 계획</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 720px; overflow: hidden; }
  body {
    font-family: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    background: #fffaf2; color: #3b2f2a; padding: 80px 100px;
  }
  .num { font-size: 24px; font-weight: 700; color: #c0612b; }
  h1 { font-size: 56px; font-weight: 800; margin: 8px 0 48px; }
  ul { list-style: none; display: grid; grid-template-columns: 1fr 1fr; gap: 28px 40px; }
  li { display: flex; gap: 24px; align-items: flex-start; background: #fff; border-left: 8px solid #f0a35e; border-radius: 16px; padding: 28px 30px; }
  .icon { font-size: 44px; line-height: 1; }
  h3 { font-size: 30px; margin-bottom: 10px; }
  p { font-size: 23px; line-height: 1.5; color: #6a564b; }
</style>
</head>
<body>
  <div class="num">02</div>
  <h1>우리 반은 이렇게 읽어요</h1>
  <ul>
    <li><span class="icon">⏰</span><div><h3>아침 독서 10분</h3><p>등교 후 수업 전, 모두 함께 조용히 책을 읽습니다.</p></div></li>
    <li><span class="icon">📚</span><div><h3>학급 문고</h3><p>교실 책장에서 언제든 자유롭게 빌려 읽을 수 있어요.</p></div></li>
    <li><span class="icon">✏️</span><div><h3>독서 기록장</h3><p>읽은 책 제목과 한 줄 느낌을 짧게 기록합니다.</p></div></li>
    <li><span class="icon">🎤</span><div><h3>한 달 한 번 책 나눔</h3><p>친구에게 재미있었던 책을 소개하는 시간을 가집니다.</p></div></li>
  </ul>
</body>
</html>
