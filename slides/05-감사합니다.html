<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>감사합니다</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 720px; overflow: hidden; }
  body {
    font-family: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    background: linear-gradient(135deg, #fff8ec 0%, #ffe9c7 100%);
    color: #3b2f2a; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
  }
  .icon { font-size: 110px; }
  h1 { font-size: 76px; font-weight: 800; margin: 24px 0 20px; }
  p { font-size: 32px; color: #6a564b; line-height: 1.6; }
  .who { margin-top: 48px; font-size: 26px; color: #c0612b; font-weight: 700; }
</style>
</head>
<body>
  <div class="icon">🙏</div>
  <h1>감사합니다</h1>
  <p>아이들의 즐거운 책 읽기, 학교와 가정이 함께 만들어 가요.<br>궁금하신 점은 편하게 질문해 주세요.</p>
  <div class="who">{{presenter}}</div>
</body>
</html>
