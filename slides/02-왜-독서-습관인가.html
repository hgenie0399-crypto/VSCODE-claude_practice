<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>왜 독서 습관인가요?</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 720px; overflow: hidden; }
  body {
    font-family: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    background: #fffaf2; color: #3b2f2a; padding: 80px 100px;
  }
  .num { font-size: 24px; font-weight: 700; color: #c0612b; }
  h1 { font-size: 56px; font-weight: 800; margin: 8px 0 56px; }
  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px; }
  .card { background: #fff; border-radius: 24px; padding: 40px 32px; box-shadow: 0 6px 20px rgba(160, 100, 50, .12); }
  .icon { font-size: 56px; }
  .card h3 { font-size: 32px; margin: 20px 0 14px; }
  .card p { font-size: 24px; line-height: 1.6; color: #6a564b; }
</style>
</head>
<body>
  <div class="num">01</div>
  <h1>왜 ‘독서 습관’인가요?</h1>
  <div class="cards">
    <div class="card">
      <div class="icon">🧠</div>
      <h3>생각하는 힘</h3>
      <p>글을 읽고 이해하는 힘은 모든 과목 공부의 바탕이 됩니다.</p>
    </div>
    <div class="card">
      <div class="icon">💬</div>
      <h3>표현하는 힘</h3>
      <p>다양한 낱말과 문장을 만나며 말하기·쓰기가 풍부해집니다.</p>
    </div>
    <div class="card">
      <div class="icon">🌱</div>
      <h3>스스로 하는 힘</h3>
      <p>매일 조금씩 읽는 습관이 꾸준함과 집중력을 길러 줍니다.</p>
    </div>
  </div>
</body>
</html>
